[package]
name = "thoook"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = []
no-entrypoint = []

[dependencies]
pinocchio = "=0.9.2"
pinocchio-system = "=0.3.0"
pinocchio-pubkey = "=0.3.0"
spl-token-2022 = { version = "=8.0.1", features = ["no-entrypoint"] }
spl-tlv-account-resolution = "=0.9.0"
spl-transfer-hook-interface = "=0.9.0"
solana-program = "=2.3.0"
